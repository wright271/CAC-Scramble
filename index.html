<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>CAC Scramble</title>
<style>
:root{
  --navy:#0a3161;
  --navy-dark:#072348;
  --navy-light:#14457f;
  --green:#1e7d33;
  --green-bg:#e6f4e9;
  --over:#c41e3a;
  --over-bg:#fdeaee;
  --gold:#f5b80c;
  --gold-bg:#fff6dd;
  --bg:#eef1f5;
  --card:#ffffff;
  --border:#d7dde6;
  --text:#1c2733;
  --muted:#5d6b7c;
  --faint:#94a1b2;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}

/* ===== Header ===== */
.hdr{background:var(--navy);color:#fff;padding:0}
.hdr-top{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px}
.hdr-title{font-size:17px;font-weight:700;letter-spacing:.3px}
.hdr-sub{font-size:11px;color:#a9bdd6;letter-spacing:.5px;text-transform:uppercase;margin-top:2px}
.hdr-lead{padding:0 16px 14px;text-align:center}
.hl-cap{font-size:10px;color:#7e92ad;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.hl-team{font-size:16px;font-weight:700;color:#fff}
.hl-score{font-size:28px;font-weight:700;line-height:1.15;margin-top:2px}
.hl-score.under{color:#7fd996}
.hl-score.over{color:#ff8fa0}
.hl-score.even{color:#fff}
.hl-thru{font-size:11px;color:#a9bdd6;margin-top:2px}
.tabs{display:flex;background:var(--navy-dark)}
.tab{flex:1;padding:11px 4px;text-align:center;font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:#8da4c2;border:none;background:transparent;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:#fff;border-bottom-color:var(--gold)}

/* ===== Layout ===== */
.wrap{max-width:760px;margin:0 auto;padding:12px 12px 40px}
.banner{background:#fff8e1;border:1px solid #f0d68a;color:#7a5d00;font-size:12px;padding:10px 12px;border-radius:6px;margin-bottom:12px;line-height:1.5}
.banner b{font-weight:700}

/* ===== Cards / tables ===== */
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}
.card-hd{background:#f4f6f9;border-bottom:1px solid var(--border);padding:8px 12px;display:flex;align-items:center;justify-content:space-between}
.card-hd .t{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.sess-meta{font-size:12px;color:var(--muted);margin:6px 2px 10px}

.team-row{display:flex;align-items:stretch;border-bottom:1px solid #edf0f4;cursor:pointer;background:var(--card)}
.team-row:last-child{border-bottom:none}
.team-row:active{background:#f4f6f9}
.tr-num{width:34px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--faint);background:#f8fafc;border-right:1px solid #edf0f4}
.tr-body{flex:1;padding:9px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.tr-name{font-size:13.5px;font-weight:700;color:var(--navy)}
.tr-players{font-size:11.5px;color:var(--muted);margin-top:1px}
.tr-status{text-align:right;min-width:70px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:11px;letter-spacing:.3px;white-space:nowrap}
.pill.under{background:var(--green-bg);color:var(--green)}
.pill.over{background:var(--over-bg);color:var(--over)}
.pill.even{background:#eceff3;color:var(--muted)}
.pill.pend{background:transparent;color:var(--faint);border:1px dashed var(--border);font-weight:600}
.pill.live{background:var(--gold-bg);color:#8a6400}
.tr-thru{font-size:10px;color:var(--faint);margin-top:2px}

/* ===== Scorecard ===== */
.sc-top{padding:12px;background:var(--card);border:1px solid var(--border);border-radius:8px;margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:5px;background:none;border:none;color:var(--navy);font-size:13px;font-weight:600;cursor:pointer;padding:0;margin-bottom:8px}
.sc-fmt{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.sc-team{font-size:16px;font-weight:700;color:var(--navy);margin-top:6px}
.sc-players{font-size:12.5px;color:var(--muted);margin-top:2px}
.sc-status{display:flex;align-items:center;justify-content:space-between;background:var(--navy);color:#fff;border-radius:6px;padding:9px 12px;margin-top:10px}
.sc-status .lbl{font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:#a9bdd6}
.sc-status .val{font-size:15px;font-weight:700}
.fmt-note{font-size:11.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.nine-hd{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:14px 2px 8px}

.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(min-width:560px){.holes{grid-template-columns:repeat(6,1fr)}}
.hole{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;text-align:center}
.hole.r-under{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.hole.r-over{border-color:var(--over);box-shadow:inset 0 0 0 1px var(--over)}
.hole.r-eagle{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.hole-num{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--faint);text-transform:uppercase;margin-bottom:1px}
.hole-par{font-size:9.5px;color:var(--faint);margin-bottom:5px}
.hinp{height:40px;font-size:18px;font-weight:600;text-align:center;border:1px solid var(--border);border-radius:6px;background:#fafbfc;color:var(--text);width:100%}
.hinp:focus{outline:none;border-color:var(--navy);background:#fff}
.hrel{font-size:10px;font-weight:700;height:14px;margin-top:4px}
.hrel.under{color:var(--green)}
.hrel.over{color:var(--over)}
.hrel.eagle{color:#8a6400}
.hrel.even{color:var(--faint)}

/* ===== Leaderboard ===== */
.total-card{background:var(--navy);border-radius:8px;color:#fff;padding:16px;margin-bottom:14px;text-align:center}
.tc-cap{font-size:10px;color:#7e92ad;text-transform:uppercase;letter-spacing:.8px;margin-bottom:4px}
.tc-name{font-size:17px;font-weight:700}
.tc-pts{font-size:34px;font-weight:700;line-height:1.15;margin-top:2px}
.lb-tbl{width:100%;border-collapse:collapse;font-size:13px}
.lb-tbl td{padding:9px 10px;border-bottom:1px solid #edf0f4;vertical-align:middle}
.lb-tbl tr:last-child td{border-bottom:none}
.lb-rank{width:26px;font-weight:700;color:var(--faint);font-size:12px}
.lb-team{font-weight:700;font-size:13px;color:var(--navy)}
.lb-players{font-size:11.5px;color:var(--muted);margin-top:1px}
.lb-thru{text-align:center;width:20%;font-size:11.5px;color:var(--muted)}
.lb-score{text-align:right;width:20%}

/* ===== Admin ===== */
.alogin{max-width:300px;margin:36px auto;text-align:center}
.alogin input{width:100%;padding:11px;border:1px solid var(--border);border-radius:6px;font-size:15px;margin:10px 0;text-align:center}
.btn{display:inline-block;padding:10px 18px;border-radius:6px;border:1px solid var(--navy);background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;letter-spacing:.3px}
.btn.ghost{background:transparent;color:var(--navy)}
.btn.danger{background:transparent;border-color:#d8a0a9;color:var(--over)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn:active{transform:scale(.98)}
.atabs{display:flex;gap:6px;margin-bottom:12px}
.atab{padding:7px 13px;border-radius:16px;border:1px solid var(--border);background:var(--card);font-size:12px;font-weight:600;color:var(--muted);cursor:pointer}
.atab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.team-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px}
.team-card .tc-hd{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);margin-bottom:6px}
.team-card input{width:100%;padding:8px 9px;border:1px solid var(--border);border-radius:5px;font-size:13px;background:#fafbfc;margin-bottom:6px}
.team-card input:last-child{margin-bottom:0}
.team-card input:focus{outline:none;border-color:var(--navy);background:#fff}
.team-card .tc-derived{font-size:13.5px;font-weight:700;color:var(--navy);text-transform:none;letter-spacing:0;margin-bottom:7px}
.team-card .tc-derived.empty{color:var(--faint);font-weight:600}
.par-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.par-cell{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:6px;text-align:center}
.par-cell .l{font-size:9px;color:var(--faint);text-transform:uppercase;font-weight:700;margin-bottom:4px}
.par-cell input{width:100%;padding:6px;border:1px solid var(--border);border-radius:5px;font-size:14px;text-align:center;background:#fafbfc}
.par-totals{font-size:12px;color:var(--muted);margin:10px 2px}
.reset-row{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;font-weight:600}
.savemsg{font-size:12px;color:var(--green);font-weight:600}
.conn{position:fixed;bottom:10px;right:10px;font-size:10px;font-weight:700;letter-spacing:.4px;padding:4px 10px;border-radius:12px;z-index:50}
.conn.on{background:var(--green-bg);color:var(--green)}
.conn.off{background:var(--over-bg);color:var(--over)}
.empty{padding:28px;text-align:center;color:var(--faint);font-size:13px}
</style>
</head>
<body>
<div id="app"></div>
<div id="conn" class="conn off">CONNECTING&hellip;</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
/* ============================================================
   STEP 1 \u2014 PASTE YOUR FIREBASE CONFIG BELOW
   (See README for the 10-minute setup. Replace the whole
   object between the braces with the one Firebase gives you.)
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCM_fjXCOZMsjBM_OMGJ40Dlz5eszHB7Gs",
  authDomain: "cac-scoring-604e3.firebaseapp.com",
  databaseURL: "https://cac-scoring-604e3-default-rtdb.firebaseio.com",
  projectId: "cac-scoring-604e3",
  storageBucket: "cac-scoring-604e3.firebasestorage.app",
  messagingSenderId: "698892126778",
  appId: "1:698892126778:web:cecc43476be0927582c303"
};
/* ============================================================ */

const ADMIN_PASSWORD = "captain"; // change this before deploying

const NUM_TEAMS = 12;
const NUM_HOLES = 18;
const COURSE_NAME = "Avalon Lakes";
const PAR_DEFAULT = [4,4,5,3,4,5,4,3,4, 4,5,3,4,5,4,3,4,4]; // Avalon Lakes, sums 36/36/72

function defaultState(){
  return {
    teams: Array.from({length:NUM_TEAMS},()=>({
      p1: '',
      p2: '',
      scores: {}
    })),
    par: PAR_DEFAULT.slice()
  };
}

/* ---------- Firebase / local fallback ---------- */
let state = defaultState();
let db = null, ref = null, online = false;
const localMode = firebaseConfig.apiKey.indexOf("PASTE") === 0;

function setConn(on, txt){
  const el = document.getElementById('conn');
  el.className = 'conn ' + (on ? 'on' : 'off');
  el.textContent = txt;
}

if (!localMode){
  try{
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    ref = db.ref('scramble');
    ref.on('value', snap=>{
      const v = snap.val();
      if (v === null){ ref.set(state); return; }
      const incoming = JSON.stringify(normalize(v));
      if (incoming === JSON.stringify(state)) return;
      state = normalize(v);
      renderPreservingFocus();
    });
    db.ref('.info/connected').on('value', s=>{
      online = !!s.val();
      setConn(online, online ? 'LIVE SYNC' : 'OFFLINE \u2014 RETRYING');
    });
  }catch(e){
    setConn(false,'SYNC ERROR');
  }
} else {
  try{ const s = localStorage.getItem('cacscramble'); if (s) state = normalize(JSON.parse(s)); }catch(e){}
  setConn(false,'LOCAL ONLY \u2014 NO SYNC');
}

/* Firebase drops empty objects, so re-hydrate the shape */
function normalize(v){
  const st = v || {};
  let teams = st.teams;
  if (!teams) teams = [];
  if (!Array.isArray(teams)) teams = Object.keys(teams).sort((a,b)=>a-b).map(k=>teams[k]);
  /* Older saved data seeded "Player 7" style placeholders; treat those as blank
     so derived team names don't come out as "7 & 8". */
  const placeholder = /^player\s*\d+$/i;
  const realName = s => (placeholder.test(String(s||'').trim()) ? '' : (s || ''));
  st.teams = Array.from({length:NUM_TEAMS},(_,i)=>{
    const t = teams[i] || {};
    return { p1: realName(t.p1), p2: realName(t.p2), scores: t.scores || {} };
  });
  let par = st.par;
  if (!par) par = [];
  if (!Array.isArray(par)) par = Object.keys(par).sort((a,b)=>a-b).map(k=>par[k]);
  st.par = Array.from({length:NUM_HOLES},(_,i)=> (par[i]!==undefined && par[i]!==null) ? par[i] : PAR_DEFAULT[i]);
  return st;
}

function persist(path, value){
  if (!localMode && ref){
    db.ref('scramble/' + path).set(value);
  } else {
    try{ localStorage.setItem('cacscramble', JSON.stringify(state)); }catch(e){}
  }
}

/* ---------- Scoring engine ---------- */
function teamResult(team){
  let strokes = 0, parSum = 0, thru = 0;
  for (let i=0;i<NUM_HOLES;i++){
    const v = parseInt(team.scores['h'+i]) || 0;
    if (!v) continue;
    strokes += v; parSum += state.par[i]; thru++;
  }
  const toPar = thru ? strokes - parSum : 0;
  return { strokes, thru, toPar, started: thru>0, done: thru===NUM_HOLES };
}
function fmtRel(n){ return n===0 ? 'E' : (n>0 ? '+'+n : String(n)); }
function relClass(n){ return n===0 ? 'even' : (n>0 ? 'over' : 'under'); }
function esc(s){ return String(s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* ---------- Team naming ----------
   A team is named for its two players' last names, e.g. "Wright & Scarcella".
   Suffixes are skipped so "Bob Miller Jr." lands on "Miller", not "Jr.". */
const SUFFIXES = /^(jr|sr|ii|iii|iv|v)\.?$/i;
function lastName(full){
  const parts = String(full||'').trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return '';
  let k = parts.length - 1;
  while (k > 0 && SUFFIXES.test(parts[k])) k--;
  return parts[k];
}
/* Falls back to "Team N" until at least one player is entered. */
function teamName(t, i){
  const a = lastName(t.p1), b = lastName(t.p2);
  if (a && b) return a + ' & ' + b;
  return a || b || ('Team ' + (i+1));
}
/* Full names under the team name; blank until players are entered. */
function playersLine(t){
  const names = [t.p1, t.p2].map(s=>String(s||'').trim()).filter(Boolean);
  return names.join(' & ');
}

function ranked(){
  return state.teams.map((t,i)=>({team:t, idx:i, r:teamResult(t)}))
    .sort((a,b)=>{
      if (a.r.started !== b.r.started) return a.r.started ? -1 : 1;
      if (a.r.toPar !== b.r.toPar) return a.r.toPar - b.r.toPar;
      if (a.r.thru !== b.r.thru) return b.r.thru - a.r.thru;
      return a.idx - b.idx;
    });
}

/* ---------- View state ---------- */
let view = 'teams';           // teams | leaderboard | admin
let scoringIdx = null;
let adminOk = false;
let adminTab = 'teams';

/* ---------- Renderers ---------- */
function render(){
  const rk = ranked();
  const leader = rk[0];
  let html = `
  <div class="hdr">
    <div class="hdr-top" style="justify-content:center;padding-bottom:0">
      <div style="text-align:center">
        <img src="./logo.png" alt="CAC Logo" style="width:90px;display:block;margin:0 auto 0;background:#fff;border-radius:8px;padding:5px">
        <div class="hdr-title" style="font-size:26px;margin-top:18px;margin-bottom:0">CAC Scramble</div>
        <div class="hdr-sub">${COURSE_NAME} \u00B7 18-Hole Scramble \u00B7 12 Teams</div>
      </div>
    </div>
    <div class="hdr-lead">`;
  if (leader && leader.r.started){
    html += `
      <div class="hl-cap">Leader</div>
      <div class="hl-team">${esc(teamName(leader.team, leader.idx))}</div>
      <div class="hl-score ${relClass(leader.r.toPar)==='over'?'over':(leader.r.toPar<0?'under':'even')}">${fmtRel(leader.r.toPar)}</div>
      <div class="hl-thru">thru ${leader.r.thru}</div>`;
  } else {
    html += `<div class="hl-cap">No scores yet</div><div class="hl-thru">Tap Teams below to start scoring</div>`;
  }
  html += `
    </div>
    <div class="tabs">
      <button class="tab ${view==='teams'?'on':''}" onclick="go('teams')">Teams</button>
      <button class="tab ${view==='leaderboard'?'on':''}" onclick="go('leaderboard')">Leaderboard</button>
      <button class="tab ${view==='admin'?'on':''}" onclick="go('admin')">Admin</button>
    </div>
  </div>
  <div class="wrap">`;

  if (localMode) html += `<div class="banner"><b>Local mode:</b> Firebase config not set \u2014 scores save on this device only. Paste your Firebase config in the file to enable live sync across phones.</div>`;

  if (scoringIdx !== null) html += renderScorecard();
  else if (view === 'teams') html += renderTeams();
  else if (view === 'leaderboard') html += renderBoard();
  else html += renderAdmin();

  html += `</div>`;
  document.getElementById('app').innerHTML = html;
}

function renderTeams(){
  let html = `<div class="sess-meta">18 holes \u00B7 scramble format \u00B7 tap your team to enter scores</div>`;
  html += `<div class="card">`;
  state.teams.forEach((t,i)=>{
    const r = teamResult(t);
    let pill;
    if (r.done) pill = `<span class="pill ${relClass(r.toPar)}">${fmtRel(r.toPar)}</span>`;
    else if (r.started) pill = `<span class="pill live">${fmtRel(r.toPar)}</span><div class="tr-thru">thru ${r.thru}</div>`;
    else pill = `<span class="pill pend">TAP TO SCORE</span>`;
    html += `
    <div class="team-row" onclick="openScore(${i})">
      <div class="tr-num">${i+1}</div>
      <div class="tr-body">
        <div>
          <div class="tr-name">${esc(teamName(t,i))}</div>
          <div class="tr-players">${esc(playersLine(t))}</div>
        </div>
        <div class="tr-status">${pill}</div>
      </div>
    </div>`;
  });
  html += `</div>`;
  return html;
}

function renderScorecard(){
  const i = scoringIdx;
  const t = state.teams[i];
  const r = teamResult(t);
  let html = `
  <div class="sc-top">
    <button class="back" onclick="closeScore()">&#8592; All teams</button>
    <div class="sc-fmt">Team ${i+1} of ${NUM_TEAMS} \u00B7 Scramble</div>
    <div class="sc-team">${esc(teamName(t,i))}</div>
    <div class="sc-players">${esc(playersLine(t))}</div>
    <div class="sc-status">
      <span class="lbl">Score</span>
      <span class="val">${r.started ? fmtRel(r.toPar) + ' \u00B7 thru ' + r.thru + (r.done? ' (final)':'') : 'NOT STARTED'}</span>
    </div>
    <div class="fmt-note">Both partners hit, pick the best ball, both play from there. Enter one team score per hole. Scores sync live \u2014 everyone sees updates instantly.</div>
  </div>`;

  html += `<div class="nine-hd">Front 9</div><div class="holes">` + holesHtml(i, t, 0, 9) + `</div>`;
  html += `<div class="nine-hd">Back 9</div><div class="holes">` + holesHtml(i, t, 9, 18) + `</div>`;
  html += `<div style="margin-top:14px"><button class="btn" onclick="closeScore()">Done \u2014 back to teams</button></div>`;
  return html;
}

function holesHtml(teamIdx, t, from, to){
  let html = '';
  for (let h=from; h<to; h++){
    const val = t.scores['h'+h] || '';
    const par = state.par[h];
    let cls = '', rel = '<div class="hrel"></div>';
    if (val){
      const diff = parseInt(val) - par;
      if (diff <= -2){ cls='r-eagle'; rel=`<div class="hrel eagle">${fmtRel(diff)}</div>`; }
      else if (diff === -1){ cls='r-under'; rel=`<div class="hrel under">${fmtRel(diff)}</div>`; }
      else if (diff === 0){ rel=`<div class="hrel even">E</div>`; }
      else { cls='r-over'; rel=`<div class="hrel over">${fmtRel(diff)}</div>`; }
    }
    html += `
    <div class="hole ${cls}">
      <div class="hole-num">Hole ${h+1}</div>
      <div class="hole-par">Par ${par}</div>
      <input class="hinp" id="in_${teamIdx}_${h}" type="number" inputmode="numeric" min="1" max="15" value="${val}"
        oninput="setScore(${teamIdx},${h},this.value)">
      ${rel}
    </div>`;
  }
  return html;
}

function renderBoard(){
  const rk = ranked();
  const leader = rk[0];
  let html = '';
  if (leader && leader.r.started){
    html += `
    <div class="total-card">
      <div class="tc-cap">Leader</div>
      <div class="tc-name">${esc(teamName(leader.team, leader.idx))}</div>
      <div class="tc-pts">${fmtRel(leader.r.toPar)} <span style="font-size:14px;font-weight:600;color:#a9bdd6">thru ${leader.r.thru}</span></div>
    </div>`;
  }
  html += `<div class="card"><div class="card-hd"><span class="t">Leaderboard</span><span class="sess-pts">${NUM_TEAMS} teams</span></div>
    <table class="lb-tbl">`;
  rk.forEach((row,pos)=>{
    const r = row.r, t = row.team;
    const rankLbl = r.started ? (pos+1) : '\u2014';
    let scoreHtml;
    if (r.started) scoreHtml = `<span class="pill ${r.done?relClass(r.toPar):'live'}">${fmtRel(r.toPar)}</span>`;
    else scoreHtml = `<span class="pill pend">\u2014</span>`;
    html += `<tr>
      <td class="lb-rank">${rankLbl}</td>
      <td><div class="lb-team">${esc(teamName(t,row.idx))}</div><div class="lb-players">${esc(playersLine(t))}</div></td>
      <td class="lb-thru">${r.started ? 'thru '+r.thru : ''}</td>
      <td class="lb-score">${scoreHtml}</td>
    </tr>`;
  });
  html += `</table></div>`;
  return html;
}

function renderAdmin(){
  if (!adminOk){
    return `<div class="alogin">
      <div style="font-weight:700;font-size:15px">Captain access</div>
      <input id="pwd" type="password" placeholder="Password" onkeydown="if(event.key==='Enter')tryPwd()">
      <button class="btn" onclick="tryPwd()" style="width:100%">Unlock</button>
    </div>`;
  }
  let html = `<div class="atabs">
    <button class="atab ${adminTab==='teams'?'on':''}" onclick="setAtab('teams')">Teams</button>
    <button class="atab ${adminTab==='course'?'on':''}" onclick="setAtab('course')">Course / Par</button>
    <button class="atab ${adminTab==='reset'?'on':''}" onclick="setAtab('reset')">Reset</button>
  </div>`;

  if (adminTab==='teams'){
    html += `<div class="sess-meta">Enter both players \u2014 the team name is their two last names. Edits save automatically and update everywhere.</div>`;
    state.teams.forEach((t,i)=>{
      const named = !!(lastName(t.p1) || lastName(t.p2));
      html += `<div class="team-card">
        <div class="tc-hd">Team ${i+1}</div>
        <div class="tc-derived ${named?'':'empty'}">${esc(named ? teamName(t,i) : 'Team ' + (i+1) + ' \u2014 add players')}</div>
        <input value="${esc(t.p1)}" onchange="setTeamField(${i},'p1',this.value)" placeholder="Player 1 full name">
        <input value="${esc(t.p2)}" onchange="setTeamField(${i},'p2',this.value)" placeholder="Player 2 full name">
      </div>`;
    });
  }

  if (adminTab==='course'){
    const outSum = state.par.slice(0,9).reduce((a,b)=>a+ (parseInt(b)||0),0);
    const inSum = state.par.slice(9,18).reduce((a,b)=>a+ (parseInt(b)||0),0);
    html += `<div class="sess-meta">${COURSE_NAME} \u2014 par per hole. Used to compute each team's score relative to par.</div>`;
    html += `<div class="nine-hd">Front 9 (out: ${outSum})</div><div class="par-grid">`;
    for (let h=0; h<9; h++){
      html += `<div class="par-cell"><div class="l">Hole ${h+1}</div><input type="number" min="3" max="6" value="${state.par[h]}" onchange="setPar(${h},this.value)"></div>`;
    }
    html += `</div>`;
    html += `<div class="nine-hd">Back 9 (in: ${inSum})</div><div class="par-grid">`;
    for (let h=9; h<18; h++){
      html += `<div class="par-cell"><div class="l">Hole ${h+1}</div><input type="number" min="3" max="6" value="${state.par[h]}" onchange="setPar(${h},this.value)"></div>`;
    }
    html += `</div>`;
    html += `<div class="par-totals">Total par: ${outSum+inSum}</div>`;
  }

  if (adminTab==='reset'){
    html += `<div class="sess-meta">Clearing scores keeps team names and pairings intact.</div>`;
    html += `<div class="reset-row"><span>All 12 teams</span>
      <button class="btn danger sm" onclick="clearAll()">Clear all scores</button></div>`;
  }
  return html;
}

/* ---------- Actions ---------- */
function go(v){ view=v; scoringIdx=null; render(); }
function setAtab(t){ adminTab=t; render(); }
function openScore(idx){ scoringIdx=idx; render(); window.scrollTo(0,0); }
function closeScore(){ scoringIdx=null; render(); }
function tryPwd(){
  const v = document.getElementById('pwd').value;
  if (v === ADMIN_PASSWORD){ adminOk=true; render(); }
  else { document.getElementById('pwd').value=''; document.getElementById('pwd').placeholder='Wrong password'; }
}

function setScore(idx, hole, val){
  const v = val === '' ? null : Math.max(1, Math.min(15, parseInt(val)||0)) || null;
  if (v === null) delete state.teams[idx].scores['h'+hole];
  else state.teams[idx].scores['h'+hole] = v;
  persist(`teams/${idx}/scores/h${hole}`, v);
  renderPreservingFocus();
}

function setTeamField(idx, field, val){
  state.teams[idx][field] = val;
  persist(`teams/${idx}/${field}`, val);
  render();
}

function setPar(hole, val){
  const v = Math.max(3, Math.min(6, parseInt(val)||4));
  state.par[hole] = v;
  persist(`par/${hole}`, v);
  render();
}

function clearAll(){
  if (!confirm('Clear all scores for every team?')) return;
  state.teams.forEach((t,i)=>{
    t.scores = {};
    persist(`teams/${i}/scores`, null);
  });
  render();
}

function renderPreservingFocus(){
  const a = document.activeElement;
  const id = a && a.id ? a.id : null;
  const val = id ? a.value : null;
  render();
  if (id){
    const el = document.getElementById(id);
    if (el){ el.focus(); if (el.tagName==='INPUT' && document.activeElement===el && el.value!==val && val!==null) el.value = val; }
  }
}

render();
</script>
